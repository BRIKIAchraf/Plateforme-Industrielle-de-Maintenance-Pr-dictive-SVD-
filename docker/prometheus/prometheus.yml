global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'predictive_maintenance_telemetry'
    static_configs:
      - targets: ['host.docker.internal:8000'] # Points to our python metrics exporter

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']
