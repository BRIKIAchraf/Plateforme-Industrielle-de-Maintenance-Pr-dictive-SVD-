name: Continuous Integration & Benchmark

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/checkout@v3
      # We setup python standard env
      
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-11-jdk-headless

    - name: Cache Pip Packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install black flake8

    - name: Lint Code Formatting
      run: |
        # Check syntax formatting with flake8 (fail on syntax errors or undefined names)
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Non-strict lint formatting check
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Scientific Component Tests
      run: |
        pytest tests/ -v

    - name: Execute Profiling Benchmarks
      run: |
        python tests/benchmarks.py

    - name: Build Docker Container (Dry Run)
      run: |
        docker build -f docker/Dockerfile -t predictive-maintenance-svd:latest . || echo "Dockerfile creation ready to be defined next"
